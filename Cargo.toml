[package]
name = "gdcli"
version = "0.1.0-alpha1"
edition = "2024"
repository = "https://github.com/IdleClover/gdcli.git"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4.6.7"
dirs = "6.0.0"
env_logger = "0.11.11"
git2 = { version = "0.21.0", features = ["https", "ssh"] }
indicatif = "0.18.6"
log = "0.4.33"
regex = "1.12.4"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
