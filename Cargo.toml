[package]
name = "gdcli"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/IdleClover/gdcli.git"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4.6.7"
dirs = "6.0.0"
enum_dispatch = "0.3.13"
env_logger = "0.11.11"
git2 = { version = "0.21.0", features = ["https", "ssh"] }
indicatif = "0.18.6"
log = "0.4.33"
regex = "1.12.4"
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.19"
toml = "1.1.3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
